<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team4x4 | Login</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page auth-login">
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark">TEAM 4X4</span>
        </div>

        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Cart</a>
        </nav>

        <div class="header-actions">
            <a href="login.html" class="button-secondary">Login</a>
            <a href="signup.html" class="button-primary">Sign Up</a>
        </div>
    </header>

    <main class="auth-main">
        <a href="index.html" class="auth-back">← Back Home</a>
        <section class="auth-card">
            <div class="auth-card-head">
                <span class="auth-chip">SECURE_CHANNEL_V4.0</span>
                <h1>TEAM 4X4</h1>
                <p class="auth-subtitle">Technical Operations Portal</p>
            </div>

            <form class="auth-form" action="backend/login.php" method="post">
                <label class="auth-field">
                    <span>Protocol ID</span>
                    <input type="email" name="email" placeholder="operator@team4x4.com" required />
                </label>

                <label class="auth-field">
                    <span>Security Key <a href="#" class="link-secondary">Forgot Security Key?</a></span>
                    <input type="password" name="password" placeholder="••••••••••••" required />
                </label>

                <label class="auth-checkbox">
                    <input type="checkbox" name="remember" /> Remember Device for 30 cycles
                </label>

                <button class="auth-button" type="submit">Initiate Session →</button>
            </form>

            <div class="auth-cta">
                <p>New Operational Personnel? <a href="signup.html">Request Access →</a></p>
            </div>
        </section>

        <section class="auth-footer">
            <div class="auth-metric">
                <strong>99.9%</strong>
                <small>Uptime</small>
            </div>
            <div class="auth-metric">
                <strong>AES-256</strong>
                <small>Encryption</small>
            </div>
            <div class="auth-metric">
                <strong>24/7</strong>
                <small>Support</small>
            </div>
            <div class="auth-metric">
                <strong>Global</strong>
                <small>Nodes</small>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
